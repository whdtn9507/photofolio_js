<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" role="img" aria-labelledby="t d"><title id="t">Legal search flow visual</title><desc id="d">Four-step flow from question to source verification.</desc><rect width="820" height="560" fill="#f4f1eb"/><path d="M92 116h636M92 434h636" stroke="#cfc9c1"/><g><circle cx="138" cy="270" r="54" fill="#fff" stroke="#a9a29a"/><text x="138" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#777">01</text><text x="138" y="288" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#1b1b1b">QUESTION</text></g><g><circle cx="316" cy="270" r="54" fill="#fff" stroke="#a9a29a"/><text x="316" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#777">02</text><text x="316" y="288" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#1b1b1b">UNDERSTAND</text></g><g><circle cx="494" cy="270" r="54" fill="#fff" stroke="#a9a29a"/><text x="494" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#777">03</text><text x="494" y="288" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#1b1b1b">RELEVANT</text></g><g><circle cx="672" cy="270" r="54" fill="#171717"/><text x="672" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#ccc">04</text><text x="672" y="288" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">EVIDENCE</text></g><path d="M192 270h70M370 270h70M548 270h70" stroke="#2d2d2d" stroke-width="2"/><path d="M254 264l10 6-10 6M432 264l10 6-10 6M610 264l10 6-10 6" fill="none" stroke="#2d2d2d" stroke-width="2"/><text x="92" y="80" font-family="Arial,sans-serif" font-size="16" fill="#5c5750" letter-spacing="2">FROM SEARCH TO DECISION SUPPORT</text><rect x="92" y="458" width="240" height="34" rx="17" fill="#fff" stroke="#ccc5bc"/><text x="212" y="480" te