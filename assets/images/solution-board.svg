<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" role="img" aria-labelledby="t d">
  <title id="t">Legal search flow visual</title>
  <desc id="d">Compact four-step flow from question to official evidence.</desc>
  <rect width="1000" height="170" fill="#f4f1eb"/>

  <path d="M142 76H338M402 76H598M662 76H858" stroke="#2d2d2d" stroke-width="1.5"/>
  <path d="M328 70l10 6-10 6M588 70l10 6-10 6M848 70l10 6-10 6" fill="none" stroke="#2d2d2d" stroke-width="1.5"/>

  <g>
    <circle cx="110" cy="76" r="32" fill="#fff" stroke="#aaa39b"/>
    <text x="110" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#777">01</text>
    <text x="110" y="84" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#1b1b1b">QUESTION</text>
    <text x="110" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#7a746d">질문</text>
  </g>

  <g>
    <circle cx="370" cy="76" r="32" fill="#fff" stroke="#aaa39b"/>
    <text x="370" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#777">02</text>
    <text x="370" y="84" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#1b1b1b">UNDERSTAND</text>
    <text x="370" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#7a746d">의도 파악</text>
  </g>

  <g>
    <circle cx="630" cy="76" r="32" fill="#fff" stroke="#aaa39b"/>
    <text x="630" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#777">03</text>
    <text x="630" y="84" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#1b1b1b">RELEVANT</text>
    <text x="630" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#7a746d">관련 근거</text>
  </g>

  <g>
    <circle cx="890" cy="76" r="32" fill="#171717"/>
    <text x="890" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#ccc">04</text>
    <text x="890" y="84" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#fff">EVIDENCE</text>
    <text x="890" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#7a746d">공식 확인</text>
  </g>
</svg>